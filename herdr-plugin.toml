id = "herdr-orch"
name = "herdr-orch"
version = "0.1.2"
min_herdr_version = "0.9.1"
description = "Orchestrate coding agents across panes: mailbox, blocking ask/reply, tasks with dependencies, tracked dispatch, persistent registered workers. CLI: horch."
platforms = ["macos", "linux"]

# `herdr plugin install` runs this: it downloads the prebuilt herdr-orch and horch binaries for
# your OS/arch from the matching GitHub release (SHA-256 verified) into ./bin, and builds from
# source only when there is no match (needs Go). `herdr plugin link` skips it: run `make build`.
[[build]]
platforms = ["macos", "linux"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

# One daemon per herdr session: follows agent status events, owns the SQLite store, serves the
# horch socket. It takes over from an older copy and exits on its own when herdr goes away.
[[startup]]
command = ["./bin/herdr-orch", "daemon"]

# Puts `horch` on PATH (symlink in ~/.local/bin) so agents and you can run it.
[[actions]]
id = "install-cli"
title = "Orchestration: install horch CLI"
contexts = ["workspace"]
command = ["./bin/herdr-orch"]
